{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom pb-3 pt-4">
            <h4 class="mb-0" style="color: var(--ink);">📸 ส่งมอบงานซ่อม</h4>
            <p class="text-muted mb-0">งาน: {{ job.title }} | ลูกค้า: {{ job.customer_name }}</p>
        </div>
        <div class="card-body p-4">
            <!-- ต้องมี enctype="multipart/form-data" ถึงจะอัปโหลดรูปได้ -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">แนบรูปภาพหลังซ่อมเสร็จ</label>
                    {{ form.completion_image }}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">หมายเหตุ / รายละเอียดการซ่อม</label>
                    {{ form.completion_note }}
                </div>
                <div class="d-flex gap-2">
                    <a href="{% url 'services:job_list' %}" class="btn btn-light w-50">ยกเลิก</a>
                    <button type="submit" class="btn text-white w-50 fw-bold" style="background-color: #3a6b3f;">ยืนยันการส่งงาน</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
