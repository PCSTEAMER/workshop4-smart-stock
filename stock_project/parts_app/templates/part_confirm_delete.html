{% extends 'base.html' %}

{% block content %}

<style>
    :root {
        --paper: #eef1ee;
        --panel: #ffffff;
        --ink: #1c211e;
        --line: #d7ddd8;
        --copper: #b2601f;
        --muted: #5c645f;
        --danger: #9c4130;
        --danger-bg: #f6e9e6;
    }

    .confirm-wrap {
        max-width: 460px;
        margin: 3rem auto;
    }
    .panel-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 3px solid var(--danger);
        border-radius: 4px;
        padding: 2rem;
    }
    .confirm-wrap h1 {
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--ink);
        margin: 0 0 0.6rem;
    }
    .confirm-wrap p.lead {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 0 0 1.25rem;
    }

    .part-detail-box {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
    }
    .part-detail-box .part-code {
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 500;
        color: var(--ink);
        font-size: 0.85rem;
        margin: 0 0 0.25rem;
    }
    .part-detail-box .part-name {
        font-size: 1rem;
        font-weight: 500;
        color: var(--ink);
        margin: 0;
    }

    .warning-box {
        background: var(--danger-bg);
        border-left: 3px solid var(--danger);
        border-radius: 3px;
        padding: 0.8rem 1rem;
        color: var(--ink);
        font-size: 0.87rem;
        text-align: left;
        margin-bottom: 1.75rem;
    }
    .warning-box strong { color: var(--danger); }

    .confirm-actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
    }
    .btn-cancel {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 0.6rem 1.4rem;
        border-radius: 6px;
        font-size: 0.92rem;
        text-decoration: none;
        transition: transform 0.12s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .btn-cancel:hover { border-color: var(--muted); background: var(--paper); color: var(--ink); transform: translateY(-1px); }
    .btn-cancel:active { transform: translateY(0); }
    .btn-delete-confirm {
        background: linear-gradient(180deg, #ad4a37 0%, var(--danger) 55%, #7f342a 100%);
        border: 1px solid #7f342a;
        color: #fff;
        padding: 0.6rem 1.5rem;
        border-radius: 6px;
        font-size: 0.92rem;
        font-weight: 500;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 1px 2px rgba(0, 0, 0, 0.15);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-delete-confirm:hover {
        transform: translateY(-1px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 10px rgba(0, 0, 0, 0.22);
    }
    .btn-delete-confirm:active { transform: translateY(0); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3); }
</style>

<div class="confirm-wrap text-center">
    <div class="panel-card">

        <h1>ยืนยันการลบข้อมูล</h1>
        <p class="lead">คุณกำลังจะลบอะไหล่ชิ้นนี้ออกจากคลัง</p>

        <div class="part-detail-box">
            <p class="part-code">{{ part.part_code }}</p>
            <p class="part-name">{{ part.name }}</p>
        </div>

        <div class="warning-box">
            <strong>คำเตือน:</strong> การกระทำนี้ไม่สามารถย้อนกลับได้ ข้อมูลและรูปภาพจะถูกลบออกจากระบบอย่างถาวร
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="confirm-actions">
                <a href="{% url 'part_list' %}" class="btn-cancel">กลับไปหน้าหลัก</a>
                <button type="submit" class="btn-delete-confirm">ใช่, ลบข้อมูลทิ้งเลย</button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
