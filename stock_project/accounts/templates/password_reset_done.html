{% extends 'base.html' %}

<!-- ปิดการแสดงผล Navbar สำหรับหน้าแจ้งเตือน เพื่อให้ดูสะอาดตา -->
{% block navbar %}{% endblock %}

{% block content %}
<style>
    .btn-custom {
        border: 1px solid var(--copper);
        color: var(--copper);
        background-color: transparent;
        font-weight: 500;
        transition: all 0.15s ease;
    }
    .btn-custom:hover {
        background-color: var(--copper);
        color: #ffffff;
        border-color: var(--copper);
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <!-- เพิ่ม mt-3 เพื่อให้กล่องเว้นระยะห่างด้านบนเท่ากับหน้า Login -->
            <div class="card shadow-sm text-center p-4 p-md-5 mt-3">
                <h4 class="mb-3 fw-bold" style="color: #3a6b3f;">✉️ ส่งอีเมลเรียบร้อยแล้ว</h4>
                <p class="text-muted small mb-4">
                    หากอีเมลที่คุณระบุมีอยู่ในระบบ ลิงก์สำหรับตั้งรหัสผ่านใหม่จะถูกส่งไปยังกล่องข้อความของคุณ โปรดตรวจสอบอีเมล (หรือดูใน Terminal หากกำลังทดสอบในเครื่อง)
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-custom btn-sm py-2 px-4">กลับสู่หน้าเข้าสู่ระบบ</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
