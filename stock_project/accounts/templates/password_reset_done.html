{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งอีเมลเรียบร้อย - คลังอะไหล่</title>
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #eef1ee;
            --panel: #ffffff;
            --ink: #1c211e;
            --line: #d7ddd8;
            --copper: #b2601f;
            --copper-deep: #8c4a17;
            --muted: #5c645f;
        }
        body {
            background-color: var(--paper) !important;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
        }
        .btn-custom {
            border: 1px solid var(--copper);
            color: var(--copper);
            background-color: transparent;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .btn-custom:hover {
            background-color: var(--copper);
            color: #ffffff;
            border-color: var(--copper);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm text-center p-4 p-md-5">
                    <h4 class="mb-3 fw-bold" style="color: #3a6b3f;">✉️ ส่งอีเมลเรียบร้อยแล้ว</h4>
                    <p class="text-muted small mb-4">
                        หากอีเมลที่คุณระบุมีอยู่ในระบบ ลิงก์สำหรับตั้งรหัสผ่านใหม่จะถูกส่งไปยังกล่องข้อความของคุณ โปรดตรวจสอบอีเมล (หรือดูใน Terminal หากกำลังทดสอบในเครื่อง)
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-custom btn-sm py-2 px-4">กลับสู่หน้าเข้าสู่ระบบ</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
