{% extends 'base.html' %}

<!-- ปิดการแสดงผล Navbar สำหรับหน้าแจ้งเตือน เพื่อให้ดูสะอาดตา -->
{% block navbar %}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <!-- เพิ่ม mt-3 เพื่อให้กล่องเว้นระยะห่างด้านบนเท่ากับหน้า Login -->
            <div class="card shadow-sm text-center p-4 p-md-5 mt-3">
                <h4 class="mb-3 fw-bold" style="color: #3a6b3f;">✅ เปลี่ยนรหัสผ่านสำเร็จ</h4>
                <p class="text-muted small mb-4">
                    ระบบได้ทำการอัปเดตรหัสผ่านใหม่ของคุณเรียบร้อยแล้ว คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary-action w-100 btn-lg py-2">เข้าสู่ระบบ</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
