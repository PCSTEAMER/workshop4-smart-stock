{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่านสำเร็จ - คลังอะไหล่</title>
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #eef1ee;
            --panel: #ffffff;
            --ink: #1c211e;
            --line: #d7ddd8;
            --copper: #b2601f;
            --copper-deep: #8c4a17;
            --muted: #5c645f;
        }
        body {
            background-color: var(--paper) !important;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
        }
        .btn-primary-action {
            background: linear-gradient(180deg, #c1712e 0%, var(--copper) 55%, var(--copper-deep) 100%);
            color: #fff;
            border: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 1px 2px rgba(0, 0, 0, 0.25);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .btn-primary-action:hover {
            color: #fff;
            transform: translateY(-1px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm text-center p-4 p-md-5">
                    <h4 class="mb-3 fw-bold" style="color: #3a6b3f;">✅ เปลี่ยนรหัสผ่านสำเร็จ</h4>
                    <p class="text-muted small mb-4">
                        ระบบได้ทำการอัปเดตรหัสผ่านใหม่ของคุณเรียบร้อยแล้ว คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary-action w-100 btn-lg py-2">เข้าสู่ระบบ</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
