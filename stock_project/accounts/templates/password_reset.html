{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - คลังอะไหล่</title>
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #eef1ee;
            --panel: #ffffff;
            --ink: #1c211e;
            --line: #d7ddd8;
            --copper: #b2601f;
            --copper-deep: #8c4a17;
            --muted: #5c645f;
        }

        body {
            background-color: var(--paper);
            font-family: 'IBM Plex Sans Thai', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        .btn-primary-action {
            background: linear-gradient(180deg, #c1712e 0%, var(--copper) 55%, var(--copper-deep) 100%);
            color: #fff;
            border: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 1px 2px rgba(0, 0, 0, 0.25);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .btn-primary-action:hover {
            color: #fff;
            transform: translateY(-1px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .form-control:focus {
            border-color: var(--copper);
            box-shadow: 0 0 0 0.2rem rgba(178, 96, 31, 0.25);
        }

        a {
            color: var(--copper);
        }
        a:hover {
            color: var(--copper-deep);
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h4 class="text-center mb-3 fw-bold" style="color: var(--ink);">🔑 ขอรีเซ็ตรหัสผ่าน</h4>
                        <p class="text-muted small text-center mb-4">
                            กรอกที่อยู่อีเมลที่ลงทะเบียนไว้ ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้
                        </p>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">อีเมลของคุณ:</label>
                                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                            <button type="submit" class="btn btn-primary-action w-100 btn-lg mb-3">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
                            <div class="text-center">
                                <a href="{% url 'accounts:login' %}" class="small text-decoration-none text-secondary">← กลับไปหน้าเข้าสู่ระบบ</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
