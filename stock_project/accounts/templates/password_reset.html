{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - คลังอะไหล่</title>
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-3">🔑 ขอรีเซ็ตรหัสผ่าน</h4>
                        <p class="text-muted small text-center mb-4">
                            กรอกที่อยู่อีเมลที่ลงทะเบียนไว้ ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้
                        </p>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">อีเมลของคุณ:</label>
                                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
                            <div class="text-center">
                                <a href="{% url 'accounts:login' %}" class="small text-decoration-none text-secondary">← กลับไปหน้าเข้าสู่ระบบ</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
